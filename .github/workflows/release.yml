name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed curl sudo

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder

      - name: Check out source
        uses: actions/checkout@v7

      - name: Pin release checksum
        working-directory: packaging/omarchy-ytmp3
        run: |
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sum="$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)"
          sed -i "s#^sha256sums=.*#sha256sums=('${sum}')#" PKGBUILD
          echo "checksum for ${GITHUB_REF_NAME}: ${sum}"

      - name: Build and refresh AUR metadata
        working-directory: packaging/omarchy-ytmp3
        run: |
          chown -R builder:builder .
          sudo -u builder makepkg --noconfirm --nodeps
          sudo -u builder sh -c 'makepkg --printsrcinfo > .SRCINFO'

      - name: Upload built package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: packaging/omarchy-ytmp3/*.pkg.tar.zst

      - name: Upload AUR files
        uses: actions/upload-artifact@v7
        with:
          name: aur
          path: |
            packaging/omarchy-ytmp3/PKGBUILD
            packaging/omarchy-ytmp3/.SRCINFO
            packaging/omarchy-ytmp3/omarchy-ytmp3.install

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download built package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: dist

      - name: Create release with package attached
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.pkg.tar.zst

  aur:
    name: Publish to AUR
    needs: package
    # Enable by setting the repository variable PUBLISH_AUR=true and the
    # AUR_USERNAME / AUR_EMAIL / AUR_SSH_PRIVATE_KEY secrets under
    # Settings > Secrets and variables > Actions.
    if: ${{ vars.PUBLISH_AUR == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download AUR files
        uses: actions/download-artifact@v8
        with:
          name: aur

      - name: Deploy to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: omarchy-ytmp3
          pkgbuild: PKGBUILD
          assets: |
            .SRCINFO
            omarchy-ytmp3.install
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Release ${{ github.ref_name }}"
          force_push: 'true'
