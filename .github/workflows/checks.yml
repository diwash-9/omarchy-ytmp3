name: Checks

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  shell:
    name: Shell checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Syntax check
        run: |
          for f in bin/ytmp3 bin/ytmp3-prompt lib/common.sh install.sh uninstall.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        run: shellcheck bin/ytmp3 bin/ytmp3-prompt lib/common.sh install.sh uninstall.sh
